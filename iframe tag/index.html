<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe Tag</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h2>Embedded YouTube Videos and Websites</h2>
    <div class="iframe-container">

        <iframe width="80%" height="600" src="https://www.youtube.com/embed/sm2hNJ9c8M8?si=DBdTSG7lCkKZFVKL&amp;start=90" 
        title="Allah Maaf Kare" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <iframe width="80%" height="600" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=TPcexTI0p8pibjax" 
        title="YouTube video player" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <iframe src="https://www.wikipedia.org" height="600" width="80%"></iframe>
    </div>
</body>
</html>
